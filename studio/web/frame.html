<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' blob:; worker-src blob:; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>游戏画面</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #eee8dd;
        color: #202c23;
        font:
          600 14px system-ui,
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px;
      }
      header {
        width: min(100%, 420px);
        min-height: 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-variant-numeric: tabular-nums;
      }
      canvas {
        width: min(100%, calc(100vh - 50px));
        height: auto;
        flex: 0 0 auto;
        aspect-ratio: 1;
        touch-action: none;
        border-radius: 10px;
        outline: none;
      }
      button {
        background: transparent;
        border: 1px solid currentColor;
        border-radius: 6px;
        color: inherit;
        font: inherit;
        cursor: pointer;
        padding: 2px 8px;
      }
      #msg {
        position: absolute;
        max-width: 85%;
        text-align: center;
        pointer-events: none;
      }
      #msg:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <span id="score"></span><span id="clock"></span
      ><button id="audio" aria-label="切换声音">声音 关</button>
    </header>
    <canvas id="field" width="640" height="640" tabindex="0" aria-label="游戏画布"></canvas>
    <div id="msg">正在连接游戏…</div>
    <script>
      'use strict';
      const nonce = location.hash.slice(1),
        canvas = document.querySelector('canvas'),
        ctx = canvas.getContext('2d');
      let meta,
        level,
        worker,
        sprite,
        sprites = {},
        sounds = {},
        enabled = false,
        running = false,
        ready = false,
        inFlight = false,
        timer = 0,
        frame = 0,
        last = 0,
        queue = [],
        journal = [],
        snapshot = null;
      const send = (type, payload = {}) => parent.postMessage({ loop: nonce, type, payload }, '*');
      const stop = () => {
        running = false;
        cancelAnimationFrame(frame);
        clearTimeout(timer);
        queue = [];
        sounds.bgm?.pause();
      };
      function fail(message) {
        stop();
        worker?.terminate();
        document.querySelector('#msg').textContent = message;
        send('error', { message });
      }
      function playSound(name) {
        if (!enabled || !sounds[name]) return;
        const a = sounds[name];
        if (name !== 'bgm') a.currentTime = 0;
        a.play().catch(() => {});
      }
      document.querySelector('#audio').onclick = () => {
        enabled = !enabled;
        document.querySelector('#audio').textContent = '声音 ' + (enabled ? '开' : '关');
        if (enabled && running) playSound('bgm');
        else sounds.bgm?.pause();
        canvas.focus();
      };
      function fitBoard() {
        const ratio = ({ portrait: 4 / 5, landscape: 3 / 2 })[meta?.viewport] || 1;
        const header = document.querySelector('header');
        const width = Math.max(1, Math.min(document.documentElement.clientWidth - 16,
          (document.documentElement.clientHeight - header.offsetHeight - 22) * ratio));
        const height = width / ratio, scale = Math.min(devicePixelRatio || 1, 2, 1600 / Math.max(width,height));
        header.style.width = canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        canvas.width = Math.max(1, Math.round(width * scale));
        canvas.height = Math.max(1, Math.round(height * scale));
        if (snapshot) render(snapshot.scene);
      }
      window.addEventListener('resize', fitBoard);
      function render(commands) {
        const p = meta.assets.palette,
          W = canvas.width, H = canvas.height, unit = Math.min(W, H);
        ctx.fillStyle = p.background;
        ctx.fillRect(0, 0, W, H);
        ctx.save();
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = p.ink;
        if (!meta.viewport) {
          for (let x = 8; x < W; x += 24) for (let y = 8; y < H; y += 24) ctx.fillRect(x, y, 2, 2);
        }
        ctx.restore();
        function color(v) {
          return /^#[0-9a-f]{6}$/i.test(v) ? v : p[v] || (v === 'soft' ? p.ink : p.accent);
        }
        for (const c of commands.slice(0, 500)) {
          if (!c || !Number.isFinite(c.x) || !Number.isFinite(c.y)) continue;
          const x = c.x * W,
            y = c.y * H,
            r = Math.max(0, Math.min(2, Number(c.r) || 0)) * unit;
          ctx.save();
          ctx.fillStyle = ctx.strokeStyle = color(c.color);
          const opacity = Number.isFinite(c.opacity) ? Math.min(1, Math.max(0, c.opacity)) : 1;
          ctx.globalAlpha = (c.color === 'soft' ? 0.28 : 1) * opacity;
          ctx.lineWidth = Math.max(1, unit * 0.004);
          if (c.kind === 'rect') ctx.fillRect(x, y, (c.w || 0) * W, (c.h || 0) * H);
          if (c.kind === 'line') {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo((c.x2 || 0) * W, (c.y2 || 0) * H);
            ctx.stroke();
          }
          if (c.kind === 'polygon' && Array.isArray(c.points) &&
              c.points.length >= 3 && c.points.length <= 32 &&
              c.points.every(p => Array.isArray(p) && p.length === 2 && p.every(Number.isFinite))) {
            ctx.beginPath();
            c.points.forEach(([dx, dy], i) => {
              if (i === 0) ctx.moveTo(x + dx * W, y + dy * H);
              else ctx.lineTo(x + dx * W, y + dy * H);
            });
            ctx.closePath();
            ctx.fill();
          }
          if (c.kind === 'circle' || c.kind === 'ring') {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            c.kind === 'ring' ? ctx.stroke() : ctx.fill();
          }
          if (c.kind === 'sprite') {
            const asset = sprites[c.asset] || sprite;
            if (asset?.naturalWidth) {
              const scale = 2 * r / Math.max(asset.naturalWidth, asset.naturalHeight);
              const w = meta.viewport ? asset.naturalWidth * scale : 2 * r;
              const h = meta.viewport ? asset.naturalHeight * scale : 2 * r;
              ctx.drawImage(asset, x - w / 2, y - h / 2, w, h);
            }
          }
          if (c.kind === 'text') {
            ctx.textAlign = 'center';
            ctx.font = 'bold ' + Math.max(12, Math.min(0.18, c.size || 0.035) * unit) + 'px system-ui';
            ctx.fillText(String(c.text || '').slice(0, 80), x, y, W);
          }
          ctx.restore();
        }
      }
      function call(msg) {
        inFlight = true;
        clearTimeout(timer);
        timer = setTimeout(() => fail('游戏脚本响应超时，请返回制作台检查构建。'), 2200);
        worker.postMessage(msg);
      }
      function tick(t) {
        if (!running) return;
        if (!inFlight && t - last >= 40) {
          const dt = Math.min(0.1, (t - last) / 1000);
          last = t;
          const events = queue.splice(0, 12);
          events.push({ type: 'tick', dt: Math.max(0.001, Math.round(dt * 1000) / 1000) });
          for (const e of events) {
            if (e.type === 'tick') journal.push(Math.round(e.dt * 1000));
            else if ('key' in e) journal.push([e.type, e.key]);
            else journal.push([e.type, Math.round(e.x * 10000), Math.round(e.y * 10000)]);
          }
          call({ kind: 'step', events });
        }
        frame = requestAnimationFrame(tick);
      }
      function contrast(hex) {
        const rgb = [1, 3, 5]
          .map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
          .map((c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
        return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2] > 0.29 ? '#18251e' : '#fffdf4';
      }
      function boot(payload) {
        meta = payload.game;
        level = payload.level;
        fitBoard();
        document.body.style.background = meta.assets.palette.background;
        document.body.style.color = contrast(meta.assets.palette.background);
        sprite = new Image();
        const paintLoaded = () => { if (snapshot) render(snapshot.scene); };
        sprite.onload = paintLoaded;
        sprite.src = meta.sprite;
        for (const [id, url] of Object.entries(meta.sprites || {})) {
          const img = new Image();
          img.onload = paintLoaded;
          img.src = url;
          sprites[id] = img;
        }
        for (const [k, url] of Object.entries(meta.sounds)) {
          sounds[k] = new Audio(url);
          sounds[k].volume = k === 'bgm' ? 0.3 : 0.6;
        }
        sounds.bgm.loop = true;
        const wrapper = `
  let module,L,s;
  self.onmessage=async function({data:m}){
    try{
      if(m.kind==='init'){await LoopCartridge.init({});module=(await LoopCartridge.get('./game'))();L=module.level(m.level,m.entry);s=module.start(L);}
      else for(const e of m.events){if(!s.done)s=module.step(s,e,L);}
      const scene=module.draw(s,L);
      if(!s || !Array.isArray(scene))throw Error('画面输出无效');
      self.postMessage({kind:m.kind,score:s.score,elapsed:s.elapsed,seconds:L.seconds,done:!!s.done,won:!!s.won,mistakes:s.mistakes||0,scene:scene.slice(0,500)});
    }catch{self.postMessage({error:'游戏模块执行失败'});}
  };`;
        const url = URL.createObjectURL(
          new Blob([meta.source, '\n', wrapper], { type: 'text/javascript' }),
        );
        worker = new Worker(url);
        URL.revokeObjectURL(url);
        worker.onerror = () => fail('游戏脚本加载失败');
        worker.onmessage = ({ data: s }) => {
          inFlight = false;
          clearTimeout(timer);
          if (s.error || !Array.isArray(s.scene)) {
            fail(s.error || '画面无效');
            return;
          }
          render(s.scene);
          document.querySelector('#score').textContent = '得分 ' + (Number(s.score) || 0);
          document.querySelector('#clock').textContent =
            Math.max(0, Math.ceil(s.seconds - s.elapsed)) + ' 秒';
          if (snapshot && s.score > snapshot.score) playSound('hit');
          else if (snapshot && s.mistakes > snapshot.mistakes) playSound('miss');
          snapshot = s;
          if (s.kind === 'init') {
            ready = true;
            document.querySelector('#msg').textContent = '';
            send('onReady');
          }
          if (s.done && running) {
            stop();
            playSound(s.won ? 'win' : 'miss');
            send('onGameEnd', {
              score: Math.trunc(s.score) || 0,
              won: s.won,
              finish: 'natural',
              inputs: journal,
            });
          }
        };
        call({ kind: 'init', level, entry: meta.level_entry });
      }
      window.addEventListener('message', (e) => {
        if (e.source !== parent || e.data?.loop !== nonce) return;
        const { type, payload } = e.data;
        if (type === 'config' && !meta) boot(payload);
        if (type === 'host:event' && payload.name === 'start' && ready && !running) {
          running = true;
          last = performance.now();
          canvas.focus();
          playSound('ui');
          playSound('bgm');
          send('onGameStart');
          frame = requestAnimationFrame(tick);
        }
        if (type === 'host:event' && payload.name === 'stop' && running) {
          stop();
          send('onGameEnd', {
            score: Math.trunc(snapshot?.score) || 0,
            won: false,
            finish: 'quit',
            inputs: [],
          });
        }
      });
      function position(e) {
        const b = canvas.getBoundingClientRect();
        return {
          x: Math.round(10000 * Math.min(0.9999, Math.max(0, (e.clientX - b.left) / b.width))) / 10000,
          y: Math.round(10000 * Math.min(0.9999, Math.max(0, (e.clientY - b.top) / b.height))) / 10000,
        };
      }
      let pointer = null;
      canvas.addEventListener('pointerdown', (e) => {
        if (!running || pointer !== null) return;
        pointer = e.pointerId;
        canvas.setPointerCapture(pointer);
        const point = position(e);
        queue.push({ type: 'press', ...point }, { type: 'tap', ...point });
        canvas.focus();
        send('app:event', { name: 'input' });
      });
      canvas.addEventListener('pointermove', (e) => {
        if (!running || e.pointerId !== pointer) return;
        const move = { type: 'move', ...position(e) };
        if (queue.at(-1)?.type === 'move') queue[queue.length - 1] = move;
        else queue.push(move);
      });
      function release(e) {
        if (e.pointerId !== pointer) return;
        pointer = null;
        if (running) queue.push({ type: 'release', ...position(e) });
      }
      canvas.addEventListener('pointerup', release);
      canvas.addEventListener('pointercancel', release);
      for (const type of ['keydown', 'keyup'])
        window.addEventListener(type, (e) => {
          if (
            !running ||
            ![
              'ArrowLeft',
              'ArrowRight',
              'ArrowUp',
              'ArrowDown',
              'Space',
              'Enter',
              'KeyW',
              'KeyA',
              'KeyS',
              'KeyD',
            ].includes(e.code)
          )
            return;
          e.preventDefault();
          queue.push({ type: type === 'keydown' ? 'key' : 'keyup', key: e.code });
        });
      send('queryGameConfig');
    </script>
  </body>
</html>
